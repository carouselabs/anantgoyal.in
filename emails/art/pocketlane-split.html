<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
body{font-family:Manrope,sans-serif}
#art{width:260px;height:300px;border-radius:20px;background:radial-gradient(80% 60% at 70% 0%,rgba(156,140,255,.35),transparent 70%),#1A1C2E;padding:18px;color:#F2F3FA}
.lbl{font-size:9px;color:#8C90AE;font-weight:600}
h5{font-size:15px;font-weight:800;margin:3px 0 2px}
.tot{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.p{display:flex;align-items:center;gap:9px;background:#24273B;border-radius:12px;padding:9px 10px;margin-bottom:7px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#0E0F1A}
.p span{flex:1;font-size:10.5px;font-weight:600}.p b{font-size:11px}
.btn{margin-top:10px;background:#C6F432;color:#0E0F1A;border-radius:12px;text-align:center;font-weight:800;font-size:11.5px;padding:10px}
</style></head><body><div id="art">
<div class="lbl">Split a bill</div><h5>Team dinner</h5><div class="tot">$126.40</div>
<div class="p"><div class="av" style="background:#C6F432">A</div><span>Alex</span><b>$42.14</b></div>
<div class="p"><div class="av" style="background:#9C8CFF">M</div><span>Maya</span><b>$42.13</b></div>
<div class="p"><div class="av" style="background:#FF8A65">J</div><span>Jordan</span><b>$42.13</b></div>
<div class="btn">Send requests</div>
</div></body></html>
