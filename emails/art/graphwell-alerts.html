<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
#art{width:252px;height:150px;border-radius:12px;background:#E5F8F1;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{background:#fff;border-radius:10px;padding:9px 11px;display:flex;gap:9px;box-shadow:0 8px 18px -10px rgba(11,27,63,.3)}
.a{width:22px;height:22px;flex:none;border-radius:6px;background:#0B1B3F;position:relative}
.a:after{content:"";position:absolute;left:6px;bottom:6px;width:3px;height:7px;background:#39D3A0;border-radius:1px;box-shadow:4.5px -3px 0 0 #39D3A0,9px -6px 0 0 #39D3A0}
.m b{font-size:9.5px;color:#0B1B3F;display:block}.m p{font-size:8.5px;color:#56627F;line-height:1.4;margin-top:2px}
.m.dim{opacity:.6;transform:scale(.96);transform-origin:top center}
</style></head><body><div id="art">
<div class="m"><div class="a"></div><div><b>Graphwell · #sales</b><p>Sign-ups are 24% above the usual Tuesday.</p></div></div>
<div class="m dim"><div class="a"></div><div><b>Graphwell · #finance</b><p>Refunds passed the limit you set.</p></div></div>
</div></body></html>
