<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview: Still sending plain-text emails?</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F4F3FC;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#100C33;}
  header{padding:32px 40px 8px;max-width:1180px;margin:0 auto;}
  h1{margin:0;font-size:28px;letter-spacing:-0.6px;font-weight:600;}
  h1 em{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;color:#7B3AEE;}
  .inbox{margin-top:16px;display:inline-block;background:#fff;border:1px solid #E5E2F4;border-radius:14px;padding:12px 16px;font-size:14px;line-height:20px;max-width:100%;}
  .inbox b{display:block;} .inbox span{color:#5C5884;}
  main{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;padding:24px 24px 64px;max-width:1180px;margin:0 auto;}
  figure{margin:0;} figcaption{font-size:13px;font-weight:600;color:#5C5884;margin:0 0 10px 4px;}
  .desk iframe{width:680px;height:2204px;border:0;border-radius:16px;background:#F4F3FC;box-shadow:0 30px 60px -30px rgba(32,16,110,.45);}
  .phone{padding:10px;background:#14112c;border-radius:44px;box-shadow:0 30px 60px -30px rgba(32,16,110,.6);}
  .phone iframe{width:375px;height:760px;border:0;border-radius:34px;background:#F4F3FC;display:block;}
</style></head>
<body>
<header>
  <h1>Cold outreach email <em>preview</em></h1>
  <div class="inbox"><b>Still sending plain-text emails?</b><span>I design and develop beautiful, responsive HTML emails that make your brand stand out in the inbox.</span></div>
</header>
<main>
  <figure class="desk"><figcaption>Desktop (680px)</figcaption><iframe src="cold-outreach.html" title="Desktop preview"></iframe></figure>
  <figure><figcaption>Phone (375px), scroll inside</figcaption><div class="phone"><iframe src="cold-outreach.html" title="Phone preview"></iframe></div></figure>
</main>
</body></html>
