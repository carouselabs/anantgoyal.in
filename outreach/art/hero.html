<!doctype html>
<!-- The cold-outreach email's hero picture (552 x 300, rendered at 2x by outreach/build.mjs).
     A founder's plain-text launch email beside a real SaaS design from the portfolio (Tandemly),
     on the site's canvas gradient, with the site's own orb and torus styles. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 552px; height: 300px; background: #ffffff; overflow: hidden; }
  .card {
    position: relative; width: 552px; height: 300px; border-radius: 20px; overflow: hidden;
    background:
      radial-gradient(70% 55% at 8% 0%, #5a78ff 0%, rgba(90,120,255,0) 62%),
      radial-gradient(60% 60% at 100% 12%, #9a44ea 0%, rgba(154,68,234,0) 62%),
      radial-gradient(80% 60% at 50% 115%, #6a2be8 0%, rgba(106,43,232,0) 65%),
      linear-gradient(160deg, #2c3cf0 0%, #4a2ee6 50%, #6e2fe6 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
  }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1.2px); background-size: 18px 18px; }

  /* The site's glossy spheres. */
  .orb { position: absolute; width: var(--s); height: var(--s); border-radius: 9999px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.98) 0, rgba(255,255,255,0.6) 4%, rgba(255,255,255,0) 20%),
      radial-gradient(circle at 74% 84%, rgba(255,255,255,0.32) 0, rgba(255,255,255,0) 30%),
      radial-gradient(circle at 38% 34%, var(--o1) 0%, var(--o2) 40%, var(--o3) 76%, var(--o4) 100%);
    box-shadow: inset calc(var(--s) * -0.07) calc(var(--s) * -0.1) calc(var(--s) * 0.2) rgba(12,2,60,0.38),
      inset calc(var(--s) * 0.04) calc(var(--s) * 0.04) calc(var(--s) * 0.12) rgba(255,255,255,0.25),
      0 calc(var(--s) * 0.22) calc(var(--s) * 0.4) calc(var(--s) * -0.12) rgba(20,6,90,0.45); }
  .blue { --o1: #b4c4ff; --o2: #4766ff; --o3: #2328cc; --o4: #110d6b; }
  .violet { --o1: #ead6ff; --o2: #a752f6; --o3: #6721d6; --o4: #2c0a77; }
  .iris { background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.98) 0, rgba(255,255,255,0.6) 4%, rgba(255,255,255,0) 20%),
      radial-gradient(circle at 42% 38%, rgba(255,255,255,0) 30%, rgba(40,12,130,0.55) 100%),
      conic-gradient(from 200deg at 46% 46%, #7fe3ff, #8d7bff, #ff9be0, #ffd88c, #9ff0d0, #7fe3ff); }
  .torus { position: absolute; width: var(--s); height: var(--s); transform: rotateX(64deg) rotateZ(-18deg); }
  .torus::before, .torus::after { content: ""; position: absolute; inset: 0; border-radius: 9999px;
    -webkit-mask: radial-gradient(circle, transparent 47%, #000 48%, #000 69%, transparent 70%); mask: radial-gradient(circle, transparent 47%, #000 48%, #000 69%, transparent 70%); }
  .torus::before { background: conic-gradient(from 160deg, #6f86ff, #c79bff, #ffffff 18%, #9a7bff 32%, #3c45dd 58%, #2a1fa8 72%, #6f86ff); }
  .torus::after { background: radial-gradient(circle, rgba(10,0,60,0.45) 46%, rgba(10,0,60,0) 56%, rgba(255,255,255,0.3) 64%, rgba(10,0,60,0.35) 70%); }

  /* Labels. */
  .label { position: absolute; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 11px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.01em; }
  .label.before { background: rgba(255,255,255,0.16); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
  .label.after { background: #fff; color: #100c33; box-shadow: 0 8px 18px -8px rgba(10,0,60,0.6); }
  .label.after i { width: 6px; height: 6px; border-radius: 9px; background: #d4ff5c; box-shadow: 0 0 0 1.5px #100c33; }

  /* The plain-text email: grey, default fonts, nothing designed. */
  .plain { position: absolute; left: 34px; top: 66px; width: 214px; height: 196px; padding: 14px 15px; background: #f3f3f4; border-radius: 10px;
    transform: rotate(-6deg); box-shadow: 0 24px 40px -18px rgba(10,0,60,0.65); filter: saturate(0.6); opacity: 0.94;
    font-family: Arial, Helvetica, sans-serif; font-size: 9.6px; line-height: 14.5px; color: #3d3d3d; }
  .plain .meta { color: #777; border-bottom: 1px solid #dcdcdc; padding-bottom: 6px; margin-bottom: 8px; font-size: 8.8px; line-height: 13px; }
  .plain a { color: #1a4fd6; text-decoration: underline; }
  .plain p { margin-bottom: 7px; }

  /* The designed email: a real portfolio design in a phone. */
  .phone { position: absolute; right: 56px; top: 22px; width: 168px; height: 330px; border-radius: 26px; padding: 6px; background: #14112c;
    transform: rotate(5deg); box-shadow: 0 30px 50px -20px rgba(10,0,60,0.8), inset 0 0 0 1px rgba(255,255,255,0.12); }
  /* Top space under the notch, like a status bar, so the email's header stays visible. */
  .phone .screen { width: 100%; height: 100%; border-radius: 21px; overflow: hidden; background: #f4f3fc; position: relative; padding-top: 24px; }
  .phone .screen img { width: 100%; display: block; }
  .phone .notch { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 46px; height: 12px; border-radius: 9px; background: #14112c; z-index: 2; }

  /* The arrow between them. */
  .arrow { position: absolute; left: 238px; top: 128px; width: 92px; height: 50px; }
</style>
</head>
<body>
<div class="card">
  <div class="dots"></div>
  <span class="torus" style="--s:150px; right:-30px; top:-52px;"></span>
  <span class="orb iris" style="--s:46px; left:250px; top:22px;"></span>
  <span class="orb blue" style="--s:58px; left:-14px; bottom:-16px;"></span>
  <span class="orb violet" style="--s:84px; right:-22px; bottom:-30px;"></span>

  <span class="label before" style="left:44px; top:28px;">Plain text</span>
  <div class="plain">
    <div class="meta">From: Sam<br>Subject: We just launched</div>
    <p>Hi there,</p>
    <p>I just launched my app. It helps small teams plan their week. Would love for you to try it:</p>
    <p><a>https://myapp.example.com</a></p>
    <p>Thanks,<br>Sam</p>
  </div>

  <svg class="arrow" viewBox="0 0 92 50" fill="none">
    <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path d="M6 38 C 30 6, 58 6, 80 24" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 6" filter="url(#glow)"/>
    <path d="M70 15 L 82 25 L 67 29" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  </svg>

  <div class="phone"><div class="screen"><span class="notch"></span><img src="../../public/previews/tandemly-early-access-mobile.webp" alt=""></div></div>
  <span class="label after" style="left:300px; top:124px;"><i></i>Designed</span>
</div>
</body>
</html>
